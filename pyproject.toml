[project]
name = "canvit-eval"
version = "0.1.0"
description = "Evaluation and benchmarking for CanViT"
requires-python = ">=3.12"
dependencies = [
    "canvit-pytorch[fovi]",
    "canvit-specialize",
    "pillow>=10.0.0",
    "tyro>=1.0.0",
    "tqdm>=4.60.0",
    "huggingface-hub>=0.20.0",
    "safetensors>=0.4.0",
    "transformers>=4.50.0",
    "statsmodels>=0.14.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["canvit_eval"]

[dependency-groups]
dev = [
    "ipykernel",  # Jupyter kernel for notebooks (installed in both .venv and .venv-cu126)
    "basedpyright>=1.37.2",
    "pytest>=9.0.2",
    "pypatree>=0.4.0",
    "ruff>=0.14.14",
    "pytest-cov>=7.0.0",
    "pandas>=3.0.2",
    "pyarrow>=23.0.1",
    "matplotlib>=3.10.8",
]
# Default GPU/CUDA path (H100, sm_90); torch from the cu128 index. Lives
# in a group (not base deps) so the cu126 V100+A100 variant can be a conflicting
# alternative resolution.
cuda = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
]
# V100 + A100 path: cu126 wheels, pinned for reproducibility (the working
# backup had torch 2.12.0 / torchvision 0.27.0). Installed only via:
#   UV_PROJECT_ENVIRONMENT=.venv-cu126 uv sync --no-group cuda --group cu126
cu126 = [
    "torch==2.12.0",
    "torchvision==0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.basedpyright]
typeCheckingMode = "standard"

[tool.ruff]
line-length = 120

[tool.uv]
default-groups = ["dev", "cuda"]
# The cu126 (V100+A100) torch in the `cu126` group is a conflicting alternative
# to the default `cuda` (cu128) torch, so uv keeps two separate locked
# resolutions. Build the V100 + A100 env with:
#   UV_PROJECT_ENVIRONMENT=.venv-cu126 uv sync --no-group cuda --group cu126
conflicts = [[{ group = "cuda" }, { group = "cu126" }]]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
# Local editable: picks up live edits in the sibling CanViT clones. Assumes the
# 5 project repos are cloned side by side in one parent folder. Swap any line
# back to its remote fork (e.g.
# `canvit-pytorch = { git = "https://github.com/jonaden94/CanViT-PyTorch.git" }`)
# to install without that sibling present. See README "Local multi-repo setup".
canvit-pytorch = { path = "../CanViT-PyTorch", editable = true }
canvit-specialize = { path = "../CanViT-specialize", editable = true }
fovi = { path = "../fovi", editable = true }
# Pin cu128 wheels on Linux GPU hosts for the default `cuda` group. On macOS,
# fall back to default PyPI (CPU-only wheels) for local development. The `cu126`
# group pulls cu126 wheels instead (sm_70-compatible).
torch = [
    { index = "pytorch-cu128", group = "cuda", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cu126", group = "cu126" },
]
torchvision = [
    { index = "pytorch-cu128", group = "cuda", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cu126", group = "cu126" },
]
